<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisiLite Agent</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>VisiLite</h1>
            <p>Privacy-first AI Agent</p>
        </header>

        <main>
            <div class="input-group">
                <textarea id="taskInput" placeholder="What should I do on this page? (e.g., 'Extract all pricing options' or 'Fill the login form')" rows="3"></textarea>
            </div>
            
            <button id="runBtn" class="primary-btn">
                <span id="btnText">Run Agent</span>
                <span id="btnLoader" class="loader hidden"></span>
            </button>

            <div class="status-container">
                <h3>Status</h3>
                <div id="statusLog" class="log-box">
                    <p class="log-entry system">Agent ready.</p>
                </div>
            </div>
        </main>
    </div>
    <script src="popup.js"></script>
</body>
</html>
